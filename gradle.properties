org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Pin the JDK Gradle itself runs on.
#
# Android Studio defaults this project's Gradle JDK to GRADLE_LOCAL_JAVA_HOME,
# which resolves from this very property. With it unset, Sync cannot start and
# the Run button stays greyed out even when a device is connected.
#
# The path below is this author's local Android Studio install and will not
# exist on another machine. Comment it out there, or set the Gradle JDK under
# Settings > Build, Execution, Deployment > Build Tools > Gradle.
# org.gradle.java.home=C\:\\Software\\AndroidStudio\\jbr

android.useAndroidX=true
android.nonTransitiveRClass=true

# Android Gradle Plugin rejects project paths containing non-ASCII characters,
# because NDK/AAPT2 have historically broken on such paths under Windows.
#
# Prefer a pure-ASCII checkout path. This override exists so that a path with
# CJK characters still builds; if you hit odd resource or native-tool failures,
# move the project to an ASCII path instead of debugging.
android.overridePathCheck=true

# AGP 8.7.3 was tested up to compileSdk 35; this project targets 36.
# Only a warning, but it is expected and harmless.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
